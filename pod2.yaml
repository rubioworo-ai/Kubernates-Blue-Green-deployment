apiVersion: v1
kind: Pod
metadata:
  name: test-invalid-image
  namespace: default
spec:
  containers:
  - name: broken-image
    image: nginx:this-image-does-not-exist-12345
---
apiVersion: v1
kind: Pod
metadata:
  name: test-crashloop
  namespace: default
spec:
  containers:
  - name: failing-app
    image: busybox
    command: ["sh", "-c", "echo 'Simulating application crash...'; exit 1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-oomkilled
  namespace: default
spec:
  containers:
  - name: memory-hog
    image: alpine
    command: ["sh", "-c", "apk add --no-cache python3 && python3 -c 'a = \" \" * 200000000; sleep(100)'"]
    resources:
      limits:
        memory: "50Mi"
