
apiVersion: argoproj.io/v1alpha1 
kind: Rollout
metadata:
  name: canary-rollouts 
  namespace: stage 

spec:
  workloadRef:
    apiVersion: apps/v1 
    kind: Deployment
    name: canary-demo-deploy 

  strategy:
    canary:
      stableService: canary-stable-app 
      canaryService: canary-preview-app
      steps:
      - setWeight: 25
      - pause: { duration: 15s }
      - setWeight: 50
      - pause: { duration: 15s }
      - setWeight: 80
      - pause: { duration: 15s }