apiVersion: apps/v1
kind: Deployment 
metadata:
  name: canary-demo-deploy 
  namespace: stage
spec:
  replicas: 0 
  selector:
    matchLabels:
      app: canary-demo-app
  template:
    metadata:
      labels:
        app: canary-demo-app
    spec:
      containers: 
      - name: web-app
        image: argoproj/rollouts-demo:blue 
        ports:
        - containerPort: 8080 
---
apiVersion: v1 
kind: Service 
metadata:
  name: canary-stable-app
  namespace: stage
spec:
  selector:
    app: canary-demo-app
  ports:
  - port: 8080
    targetPort: 8080 
---
apiVersion: v1 
kind: Service 
metadata:
  name: canary-preview-app
  namespace: stage
spec:
  selector:
    app: canary-demo-app
  ports:
  - port: 8080
    targetPort: 8080 
