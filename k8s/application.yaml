apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollouts-demo-app
  namespace: argocd
spec:
  project: rollout-demo-project
  source:
    repoURL: https://github.com/rubioworo-ai/Kubernates-Blue-Green-deployment.git
    targetRevision: main
    path: monitoring/
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollouts-demo-blue-green
  namespace: argocd
spec:
  project: rollout-demo-project
  source:
    repoURL: https://github.com/rubioworo-ai/Kubernates-Blue-Green-deployment.git
    targetRevision: main
    path: bluegreen/
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true