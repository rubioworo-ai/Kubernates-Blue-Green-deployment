apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollouts-demo-app
  namespace: argocd
spec:
  project: rollout-demo-project
  source:
    repoURL: https://github.com/rubioworo-ai/Kubernates-Blue-Green-deployment.git
    targetRevision: main
    path: rollouts/ 
  destination:
    server: https://kubernetes.default.svc
    namespace: stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true 