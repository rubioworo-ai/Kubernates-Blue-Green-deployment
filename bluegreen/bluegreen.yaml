
apiVersion: v1
kind: Service
metadata:
  name: bluegreen-active-svc
  namespace: dev
spec:
  ports:
  - port: 80
    targetPort: 8080
    name: http
  selector:
    app: bluegreen-demo
---
apiVersion: v1
kind: Service
metadata:
  name: bluegreen-preview-svc
  namespace: dev
spec:
  ports:
  - port: 80
    targetPort: 8080
    name: http
  selector:
    app: bluegreen-demo
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: bluegreen-demo
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bluegreen-demo
  template:
    metadata:
      labels:
        app: bluegreen-demo
    spec:
      containers:
      - name: web
        image: argoproj/rollouts-demo:yellow
        ports:
        - containerPort: 8080
  strategy:
    blueGreen:
      activeService: bluegreen-active-svc
      previewService: bluegreen-preview-svc
      autoPromotionEnabled: false 