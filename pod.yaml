apiVersion: v1
kind: Namespace
metadata:
  name: chaos-testing
---
# Scenario A: OOMKilled Pod
# Allocates 200MB of RAM into a 50MB memory-limited container
apiVersion: v1
kind: Pod
metadata:
  name: test-oomkilled
  namespace: chaos-testing
spec:
  containers:
  - name: memory-hog
    image: alpine
    command: ["sh", "-c", "apk add --no-cache python3 && python3 -c 'a = \" \" * 200000000; sleep(100)'"]
    resources:
      limits:
        memory: "50Mi"
---
# Scenario B: CrashLoopBackOff Pod
# Starts and immediately exits with a non-zero exit code
apiVersion: v1
kind: Pod
metadata:
  name: test-crashloop
  namespace: chaos-testing
spec:
  containers:
  - name: failing-app
    image: busybox
    command: ["sh", "-c", "echo 'Application critical error!'; exit 1"]
---
# Scenario C: Pending Pod
# Demands 1000 CPUs, which no single node can satisfy
apiVersion: v1
kind: Pod
metadata:
  name: test-pending
  namespace: chaos-testing
spec:
  containers:
  - name: huge-resource-app
    image: nginx
    resources:
      requests:
        cpu: "1000"
